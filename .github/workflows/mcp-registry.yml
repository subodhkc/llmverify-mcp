name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish-registry:
    name: Submit server.json to the MCP Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'

      # The MCP Registry validates the npm package referenced by
      # server.json: package.json must carry the matching `mcpName`
      # field, and the declared version must be live on npm.
      - name: Wait for npm package to be available
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SVR_VERSION=$(node -p "require('./server.json').version")
          if [ "$PKG_VERSION" != "$SVR_VERSION" ]; then
            echo "::error::server.json version $SVR_VERSION != package.json $PKG_VERSION"
            exit 1
          fi
          for i in $(seq 1 30); do
            if npm view "llmverify-mcp@$PKG_VERSION" version >/dev/null 2>&1; then
              echo "llmverify-mcp@$PKG_VERSION is live on npm"
              exit 0
            fi
            echo "Waiting for npm propagation ($i/30)..."
            sleep 20
          done
          echo "::error::llmverify-mcp@$PKG_VERSION not visible on npm after 10 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s)_$(uname -m).tar.gz"
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
